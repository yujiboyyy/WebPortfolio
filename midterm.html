<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midterm & Group Activities</title>
    <style>
        body {
            background-color: #0d0d0d;
            color: #fff;
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
        }
        header {
            background: linear-gradient(135deg, #1a1a1a, #333);
            color: white;
            text-align: center;
            padding: 20px;
        }
        h1 {
            color: #f0a500;
        }
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            padding: 40px;
            max-width: 1000px;
            margin: 0 auto;
        }
        .container img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(255, 255, 255, 0.1);
            transition: transform 0.3s ease;
        }
        .container img:hover {
            transform: scale(1.05);
        }
        footer {
            background: linear-gradient(135deg, #1a1a1a, #333);
            color: white;
            text-align: center;
            padding: 20px;
        }
        a.back {
            display: inline-block;
            margin-top: 20px;
            background: #f0a500;
            color: #000;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
        }
        a.back:hover {
            background: #ffcc00;
        }
    </style>
</head>
<body>

<header>
    <h1>Midterm & Group Activities</h1>
    <p>Here are some highlights from my academic group works and midterm submissions.</p>
</header>

<div class="container">
    <img src="m1.jpeg" alt="Activity 1">
    <img src="m2.jpeg" alt="Activity 2">
    <img src="m3.jpeg" alt="Activity 3">
    <img src="m4.jpeg" alt="Activity 4">
</div>

<div style="text-align: center;">
    <a href="index.html" class="back">Back to Home</a>
</div>

<footer>
    <p>&copy; 2025 Lance Emmanuel M. Canaveral. All rights reserved.</p>
</footer>

</body>
</html>
