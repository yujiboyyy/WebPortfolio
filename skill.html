<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Skills</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #0d0d0d;
            color: #fff;
            text-align: center;
        }
        header {
            background: linear-gradient(135deg, #1a1a1a, #333);
            color: white;
            padding: 20px;
            font-size: 2rem;
        }
        main {
            padding: 30px;
        }
        .skills-container {
            max-width: 700px;
            margin: 0 auto;
            background: #1c1c1c;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(255, 255, 255, 0.1);
        }
        .skills-container h2 {
            color: #f0a500;
        }
        ul {
            list-style-type: none;
            padding: 0;
            font-size: 1.2rem;
        }
        ul li {
            background: #222;
            padding: 20px;
            margin: 15px 0;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(255, 255, 255, 0.1);
            text-align: center;
        }
        .btn-container {
            margin-top: 20px;
        }
        .btn {
            background-color: #f0a500;
            color: white;
            border: none;
            padding: 16px 24px;
            cursor: pointer;
            border-radius: 10px;
            font-size: 1.2rem;
            transition: all 0.3s ease-in-out;
            text-decoration: none;
            display: inline-block;
        }
        .btn:hover {
            background-color: #ffcc00;
            transform: scale(1.05);
        }
        footer {
            background: linear-gradient(135deg, #1a1a1a, #333);
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <header>
        Skills
    </header>
    
    <main>
        <div class="skills-container">
            <h2>My Skills</h2>
            <ul>
                <li>Active Listening</li>
                <li>Communication</li>
                <li>Teamwork</li>
                <li>Adaptability</li>
                <li>Time Management</li>
            </ul>
            <div class="btn-container">
                <a href="about.html" class="btn">Back to Home Page</a>
            </div>
        </div>
    </main>
    
    <footer>
        <p>&copy; 2025 Lance Emmanuel M. Canaveral. All rights reserved.</p>
    </footer>
</body>
</html>
